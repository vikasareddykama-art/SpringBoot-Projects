# ---------------------------------------------------------------
# Bus Travel Booking Management System - configuration
# ---------------------------------------------------------------
spring.application.name=bus-booking-system
server.port=8080

# ---- MySQL datasource ------------------------------------------
# createDatabaseIfNotExist=true creates bus_booking_db automatically on first run.
# Change DB_USERNAME / DB_PASSWORD below, or set them as environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/bus_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:PASSWORD1234}

# ---- JPA / Hibernate -------------------------------------------
# "update" creates / alters the BusBookings table automatically.
spring.jpa.hibernate.ddl-auto=update
# Keep column and table names exactly as written in the specification
# (BookingID, PassengerName, ... , table BusBookings).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JSON -------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Sample data ------------------------------------------------
# When true and the table is empty, 8 sample bookings are inserted at startup.
app.seed-sample-data=true
